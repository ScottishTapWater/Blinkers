name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.semver.outputs.nextStrict }}
      tag: ${{ steps.semver.outputs.next }}
    steps:
      - name: Calculate next version
        id: semver
        uses: ietf-tools/semver-action@v1.11.0
        with:
          token: ${{ github.token }}
          branch: ${{ github.sha }}
          fallbackTag: v0.0.0
          minorList: feat
          patchList: fix,perf
          noNewCommitBehavior: silent
          noVersionBumpBehavior: silent

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check shell scripts
        run: shellcheck build.sh scripts/*.sh tests/*.sh
      - name: Test version codes
        run: bash tests/version-code.sh
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blinkers-release.p12"
          printf 'APK_KEYSTORE=%s/blinkers-release.p12\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build and verify release APK
        env:
          APK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          bash build.sh
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/blinkers-release.p12"
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/blinkers.apk "dist/Blinkers-$VERSION.apk"
          cd dist
          sha256sum "Blinkers-$VERSION.apk" > "Blinkers-$VERSION.apk.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: blinkers-release-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/Blinkers-$VERSION.apk" "dist/Blinkers-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" --title "Blinkers $VERSION" --generate-notes
