name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check shell scripts
        run: shellcheck build.sh scripts/*.sh tests/*.sh
      - name: Test version codes
        run: bash tests/version-code.sh
      - name: Build and verify debug APK
        env:
          VERSION: 0.0.0-dev
          BUILD_TYPE: debug
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          bash build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: blinkers-debug
          path: build/blinkers.apk
          if-no-files-found: error
